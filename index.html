<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktiv Labs</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#0B0F17',
                            card: '#131B2A',
                            border: '#1E293B',
                            accent: '#10B981',
                            cyan: '#06B6D4'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #0B0F17;
            color: #F8FAFC;
        }

        /* Ambient Glow Orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.15;
            pointer-events: none;
        }

        /* Glassmorphism Card */
        .glass-box {
            background: linear-gradient(135deg, rgba(19, 27, 42, 0.6) 0%, rgba(11, 15, 23, 0.8) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        /* Gradient Accent Text */
        .gradient-text {
            background: linear-gradient(135deg, #10B981 0%, #06B6D4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between relative overflow-hidden selection:bg-emerald-500 selection:text-slate-950 p-6">

    <!-- Background Orbs -->
    <div class="glow-orb w-[500px] h-[500px] bg-emerald-500 -top-32 -left-32"></div>
    <div class="glow-orb w-[500px] h-[500px] bg-cyan-500 -bottom-32 -right-32"></div>

    <!-- Top Spacer / Brand Tag -->
    <header class="w-full max-w-xl text-center pt-8 z-10">
        <span class="inline-flex items-center space-x-2 text-xs font-mono uppercase tracking-widest text-slate-500 bg-slate-900/60 border border-slate-800 px-3 py-1 rounded-full backdrop-blur-md">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>Little studio from Poland 🇵🇱</span>
        </span>
    </header>

    <!-- MAIN CENTER CARD -->
    <main class="w-full max-w-lg my-auto z-10">
        <div class="glass-box rounded-3xl p-8 sm:p-10 text-center shadow-2xl relative overflow-hidden">
            
            <!-- Glowing Inner Edge -->
            <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-emerald-500/40 to-transparent"></div>

            <!-- Logo Mark (Styled Icon matching your Aktiv Labs Logo) -->
            <div class="mx-auto w-20 h-20 mb-8 rounded-2xl bg-gradient-to-br from-emerald-500 via-cyan-500 to-blue-600 p-[2px] shadow-xl shadow-emerald-500/20">
                <div class="w-full h-full bg-[#0B0F17] rounded-[14px] flex items-center justify-center relative overflow-hidden">
                    <!-- Custom SVG "A" Arrow Logo -->
                    <svg class="w-10 h-10 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3L2 21h20L12 3z" />
                        <path d="M12 3l6 12H6l6-12z" fill="currentColor" fill-opacity="0.2" />
                        <path d="M7 15h10" />
                        <path d="M15 11l4-4" stroke="#06B6D4" stroke-width="2" />
                    </svg>
                </div>
            </div>

            <!-- Title -->
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-2">
                Aktiv<span class="gradient-text">Labs</span>
            </h1>

            <!-- Subtitle -->
            <p class="text-sm font-medium text-slate-400 mb-6 tracking-wide">
                Little studio from Poland
            </p>

            <!-- Statement -->
            <div class="bg-slate-900/80 border border-slate-800/80 rounded-xl p-4 mb-8 text-xs sm:text-sm text-slate-300 leading-relaxed font-normal">
                Właśnie wystartowaliśmy.<br />Pracujemy nad pierwszymi narzędziami internetowymi.
            </div>

            <!-- GitHub Button -->
            <a href="https://github.com/AktivLabs" target="_blank" rel="noopener noreferrer" 
               class="inline-flex items-center justify-center space-x-2.5 w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl text-sm transition-all shadow-lg shadow-emerald-500/20 hover:shadow-emerald-500/30 hover:scale-[1.02] active:scale-[0.98]">
                <i class="fab fa-github text-lg"></i>
                <span>github.com/AktivLabs</span>
                <i class="fas fa-arrow-up-right-from-square text-xs ml-1 opacity-75"></i>
            </a>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="w-full max-w-xl text-center pb-8 z-10 text-xs text-slate-600 font-mono">
        © 2026 Aktiv Labs. Wszystkie prawa zastrzeżone.
    </footer>

</body>
</html>
